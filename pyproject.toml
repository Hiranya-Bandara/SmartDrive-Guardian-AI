[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdrive-guardian-ai"
version = "2.0.0"
description = "AI-powered desktop application for intelligent vehicle diagnostics, real-time telemetry monitoring, anomaly detection and predictive maintenance assistance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["vehicle-diagnostics", "obd2", "predictive-maintenance", "pyside6", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Runtime dependencies are added phase by phase, only when code uses them.
# Phase 3 adds the ML stack; Phase 4 adds PySerial (read-only ELM327 client written in-house,
# chosen over GPL-2.0-only python-OBD), ReportLab and pyttsx3. PySide6-Essentials (not the full
# PySide6 meta-package) provides QtWidgets/QtSvg without the large add-on modules.
dependencies = [
    "platformdirs>=4.3,<5",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "PySide6-Essentials>=6.8,<6.13",
    "pyqtgraph>=0.13.7,<0.15",
    "numpy>=2.0,<3",
    # The shipped model artifacts only load with the scikit-learn minor version that trained
    # them (enforced by the model registry); retrain with scripts/train_models.py when bumping.
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4,<2",
    "pyserial>=3.5,<4",
    "reportlab>=4.4,<6",
    "pyttsx3>=2.98,<3",
]

[project.optional-dependencies]
# Only needed to regenerate the dataset, models and evaluation figures.
training = [
    "matplotlib>=3.9,<4",
]
dev = [
    "smartdrive-guardian-ai[training]",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyserial>=3.5",
    "pip-audit>=2.7",
]

[project.scripts]
smartdrive = "smartdrive.cli:main"

[project.gui-scripts]
smartdrive-gui = "smartdrive.ui.application:main"

[project.urls]
Repository = "https://github.com/Hiranya-Bandara/SmartDrive-Guardian-AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartdrive = [
    "py.typed",
    "database/migrations/env.py",
    "database/migrations/script.py.mako",
    "database/migrations/versions/*.py",
    "ui/themes/*.qss",
    "ai/artifacts/manifest.json",
    "ai/artifacts/evaluation_metrics.json",
    "ai/artifacts/*.joblib",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH", "LOG", "G"]
# RUF001/RUF002: typographic characters (×, –, °) are intentional user-facing text.
ignore = ["G004", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "PLR2004"]
# Deterministic seeded PRNG is required for reproducible simulation, not for security.
"src/smartdrive/services/simulator.py" = ["S311"]
"src/smartdrive/ai/dataset.py" = ["S311"]
"src/smartdrive/ui/icons.py" = ["E501"]
"src/smartdrive/database/migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["smartdrive"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pyqtgraph", "pyqtgraph.*", "sklearn", "sklearn.*", "joblib", "joblib.*",
    "pyttsx3", "pyttsx3.*", "comtypes", "comtypes.*", "reportlab", "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smartdrive.database.migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "integration: tests that touch the filesystem or a real SQLite database",
    "ui: tests that create Qt widgets (run headless with QT_QPA_PLATFORM=offscreen)",
]
qt_api = "pyside6"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["smartdrive"]
branch = true
omit = ["*/database/migrations/versions/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

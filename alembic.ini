# Developer-only Alembic configuration. The application runs migrations itself at startup.
# Example (PowerShell):
#   $env:SMARTDRIVE_DB_URL = "sqlite:///$((Get-Location).Path -replace '\\','/')/dev.db"
#   alembic revision --autogenerate -m "describe change"
[alembic]
script_location = src/smartdrive/database/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

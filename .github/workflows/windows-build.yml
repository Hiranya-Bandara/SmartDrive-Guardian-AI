name: Windows build

# Builds and verifies the Windows distribution: PyInstaller one-folder build, packaged smoke
# test, portable ZIP, Inno Setup installer, automated install/upgrade/uninstall test, SBOM,
# notices and checksums. Artifacts are uploaded to the workflow run only; nothing is published.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-release.txt

      - name: Create the build environment (.venv with pinned dependencies)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -r requirements-release.txt
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          .\.venv\Scripts\python.exe -m pip check

      - name: Ensure Inno Setup 6
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup could not be installed.' }
          (Get-Item $iscc).VersionInfo.ProductVersion

      - name: Build executable, smoke test and portable ZIP (includes ruff, mypy, pytest)
        run: .\scripts\build-windows.ps1

      - name: Build installer
        run: .\scripts\build-installer.ps1

      - name: Automated installer test (install, smoke test, upgrade, uninstall)
        run: .\scripts\test-installer.ps1

      - name: SBOM, notices, build information and checksums
        run: .\scripts\generate-checksums.ps1

      - name: Verify release folder
        run: .\scripts\verify-release.ps1

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartdrive-windows-release-candidate
          path: release/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartdrive-windows-build-logs
          path: |
            build/smoke-test/
            build/installer-test/
            build/windows-version-info.txt
            build/pyinstaller/smartdrive/warn-smartdrive.txt
          retention-days: 14
          if-no-files-found: warn

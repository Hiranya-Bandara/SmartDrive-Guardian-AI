name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This request does not require writing to the vehicle ECU, clearing codes automatically or actuator control.
          required: true
